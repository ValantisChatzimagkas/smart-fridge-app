name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-fridge-app-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smart-fridge-app-ui/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
