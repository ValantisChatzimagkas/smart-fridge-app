services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_USERNAME: ${MONGO_USERNAME:?set MONGO_USERNAME in .env}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-ingredients_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      EXPIRY_WARN_DAYS: ${EXPIRY_WARN_DAYS:-3}

  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?set MONGO_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-ingredients_db}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  ui:
    build:
      context: ./smart-fridge-app-ui
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${UI_PORT:-5173}:80"

volumes:
  mongo_data:
